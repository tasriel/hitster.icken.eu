<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hitster Player</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
  }
  h1 { margin-bottom: 1.5rem; }
  button {
    font-size: 1.05rem;
    padding: 0.6rem 1.2rem;
    margin: 0.4rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: #1db954;
    color: #000;
    font-weight: 600;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #video {
    width: min(90vw, 420px);
    border-radius: 12px;
    background: #000;
  }
  #canvas { display: none; }
  #scan-view, #now-playing-view { display: flex; flex-direction: column; align-items: center; }
  #now-playing-view { display: none; }
  #equalizer {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    height: 90px;
    width: min(90vw, 420px);
  }
  #equalizer span {
    width: 14px;
    background: #1db954;
    border-radius: 4px;
    animation: bounce 1s ease-in-out infinite;
  }
  #equalizer span:nth-child(1) { animation-delay: 0s; }
  #equalizer span:nth-child(2) { animation-delay: 0.2s; }
  #equalizer span:nth-child(3) { animation-delay: 0.4s; }
  #equalizer span:nth-child(4) { animation-delay: 0.6s; }
  @keyframes bounce {
    0%, 100% { height: 15%; }
    50% { height: 100%; }
  }
  #controls { display: flex; gap: 0.5rem; margin-top: 1.2rem; }
  #status {
    margin-top: 1rem;
    font-size: 1rem;
    opacity: 0.85;
    text-align: center;
    max-width: 420px;
    min-height: 1.4em;
  }
  #player-screen { display: none; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <h1>🎧 Hitster Player</h1>

  <!-- Step 1: log in with Spotify -->
  <div id="login-screen">
    <p>Mit deinem Spotify-Premium-Account einloggen:</p>
    <button id="login-button">Mit Spotify verbinden</button>
    <p style="max-width:420px; font-size:0.85rem; opacity:0.7;">
      Erfordert ein Spotify-Premium-Konto. Jede:r loggt sich mit dem
      eigenen Account ein.
    </p>
    <p style="max-width:420px; font-size:0.8rem; opacity:0.6;">
      Redirect URI, die exakt so im Spotify-App-Dashboard hinterlegt sein muss:
    </p>
    <code id="redirect-uri-display" style="font-size:0.8rem; word-break:break-all; background:#222; padding:0.4rem 0.6rem; border-radius:6px; display:inline-block; max-width:80vw;"></code>
    <br />
    <button id="copy-redirect-uri" style="font-size:0.8rem; padding:0.3rem 0.7rem; margin-top:0.4rem;">In Zwischenablage kopieren</button>
  </div>

  <!-- Step 2: camera + playback (no title/artist ever shown) -->
  <div id="player-screen">
    <div id="scan-view">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>
    <div id="now-playing-view">
      <div id="equalizer">
        <span></span><span></span><span></span><span></span>
      </div>
      <div id="controls">
        <button id="pause-button">⏸ Pause</button>
        <button id="next-button">⏭ Nächste Karte</button>
      </div>
    </div>
    <div id="status">Verbinde …</div>
  </div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function () {
  "use strict";

  // Deine Spotify Client ID (aus dem App-Dashboard) - kein Secret, darf
  // im clientseitigen Code stehen.
  const CLIENT_ID = "1ebdd25083a54609b5700cdb95717068";

  // Must exactly match a Redirect URI configured in your Spotify app
  // settings (https://developer.spotify.com/dashboard).
  const REDIRECT_URI = window.location.origin + window.location.pathname;
  const SCOPES = "streaming user-read-email user-read-private user-modify-playback-state";

  const loginScreen = document.getElementById("login-screen");
  const playerScreen = document.getElementById("player-screen");
  const scanView = document.getElementById("scan-view");
  const nowPlayingView = document.getElementById("now-playing-view");
  const statusEl = document.getElementById("status");
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const canvasCtx = canvas.getContext("2d", { willReadFrequently: true });
  const pauseButton = document.getElementById("pause-button");
  const nextButton = document.getElementById("next-button");

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function showScanView() {
    scanView.style.display = "flex";
    nowPlayingView.style.display = "none";
  }

  function showNowPlayingView() {
    scanView.style.display = "none";
    nowPlayingView.style.display = "flex";
  }

  // --- PKCE helpers (no client secret needed) -------------------------------

  function randomString(length) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const values = crypto.getRandomValues(new Uint8Array(length));
    return Array.from(values, (v) => chars[v % chars.length]).join("");
  }

  async function sha256Base64Url(plain) {
    const data = new TextEncoder().encode(plain);
    const digest = await crypto.subtle.digest("SHA-256", data);
    const bytes = new Uint8Array(digest);
    let binary = "";
    bytes.forEach((b) => { binary += String.fromCharCode(b); });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  async function redirectToLogin() {
    const codeVerifier = randomString(64);
    sessionStorage.setItem("pkce_code_verifier", codeVerifier);

    const codeChallenge = await sha256Base64Url(codeVerifier);
    const params = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: "code",
      redirect_uri: REDIRECT_URI,
      scope: SCOPES,
      code_challenge_method: "S256",
      code_challenge: codeChallenge,
    });
    window.location.href = `https://accounts.spotify.com/authorize?${params}`;
  }

  async function exchangeCodeForToken(code) {
    const codeVerifier = sessionStorage.getItem("pkce_code_verifier");

    const response = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "authorization_code",
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: codeVerifier,
      }),
    });
    if (!response.ok) throw new Error(`Token-Austausch fehlgeschlagen (${response.status})`);
    return response.json();
  }

  async function refreshAccessToken() {
    const refreshToken = sessionStorage.getItem("spotify_refresh_token");
    if (!refreshToken) return null;

    const response = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "refresh_token",
        refresh_token: refreshToken,
      }),
    });
    if (!response.ok) return null;

    const data = await response.json();
    storeTokens(data);
    return data.access_token;
  }

  function storeTokens(data) {
    sessionStorage.setItem("spotify_access_token", data.access_token);
    if (data.refresh_token) sessionStorage.setItem("spotify_refresh_token", data.refresh_token);
  }

  // --- App bootstrap ---------------------------------------------------------

  let accessToken = sessionStorage.getItem("spotify_access_token");

  // Show the exact string being sent, so it can be pasted 1:1 into the
  // Spotify dashboard instead of eyeballing the browser's address bar
  // (trailing slashes, www vs. non-www, http->https redirects etc. are
  // easy to miss visually but make Spotify reject the redirect_uri).
  document.getElementById("redirect-uri-display").textContent = REDIRECT_URI;
  console.log("Spotify redirect_uri:", REDIRECT_URI);

  document.getElementById("copy-redirect-uri").addEventListener("click", () => {
    navigator.clipboard.writeText(REDIRECT_URI);
  });

  document.getElementById("login-button").addEventListener("click", () => {
    redirectToLogin();
  });

  async function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get("code");
    const authError = urlParams.get("error");

    if (authError) {
      setStatus("Anmeldung fehlgeschlagen: " + authError);
      return;
    }

    if (code) {
      window.history.replaceState({}, document.title, window.location.pathname);
      try {
        const data = await exchangeCodeForToken(code);
        storeTokens(data);
        accessToken = data.access_token;
      } catch (err) {
        setStatus("Fehler beim Login: " + err.message);
        return;
      }
    }

    if (!accessToken) return; // stay on the login screen

    loginScreen.style.display = "none";
    playerScreen.style.display = "flex";
    setStatus("Verbinde mit Spotify …");
    startPlayer();
  }

  // --- Spotify Web Playback SDK ------------------------------------------------

  let player = null;
  let deviceId = null;

  window.onSpotifyWebPlaybackSDKReady = () => {
    // Only starts once init() has confirmed we have a token; safe to define
    // the callback unconditionally, it's simply not used until then.
  };

  function startPlayer() {
    player = new Spotify.Player({
      name: "Hitster Player",
      getOAuthToken: async (callback) => {
        callback(accessToken);
      },
      volume: 0.8,
    });

    player.addListener("ready", ({ device_id }) => {
      deviceId = device_id;
      setStatus("Bereit – QR-Code vor die Kamera halten.");
      startCameraScanning();
    });

    player.addListener("not_ready", () => setStatus("Player getrennt."));
    player.addListener("initialization_error", ({ message }) => setStatus("Initialisierungsfehler: " + message));
    player.addListener("authentication_error", () => setStatus("Login abgelaufen, bitte Seite neu laden."));
    player.addListener("account_error", () => setStatus("Konto-Fehler – ist dein Account Spotify Premium?"));

    // Keeps the Pause/Play button label in sync with actual playback state,
    // however it changed (our button, another Spotify app, etc.).
    player.addListener("player_state_changed", (state) => {
      if (!state) return;
      pauseButton.textContent = state.paused ? "▶ Play" : "⏸ Pause";
    });

    pauseButton.addEventListener("click", () => player.togglePlay());
    nextButton.addEventListener("click", async () => {
      await player.pause();
      startCameraScanning();
    });

    player.connect();
  }

  async function playTrack(trackId, attempt = 1) {
    const response = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${accessToken}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ uris: [`spotify:track:${trackId}`] }),
    });

    if (response.status === 401 && attempt === 1) {
      const newToken = await refreshAccessToken();
      if (newToken) {
        accessToken = newToken;
        return playTrack(trackId, 2);
      }
    }

    if (!response.ok && response.status !== 204) {
      throw new Error(`Wiedergabe fehlgeschlagen (${response.status})`);
    }
  }

  // --- QR code scanning (camera) -----------------------------------------------

  let cameraStream = null;
  let scanningActive = false;

  function extractTrackId(text) {
    // Matches both open.spotify.com/track/<id> links and spotify:track:<id> URIs.
    const match = text.match(/track[/:]([a-zA-Z0-9]+)/);
    return match ? match[1] : null;
  }

  async function startCameraScanning() {
    showScanView();
    try {
      if (!cameraStream) {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
        });
        video.srcObject = cameraStream;
      }
      scanningActive = true;
      requestAnimationFrame(scanFrame);
    } catch (err) {
      setStatus("Kamera-Zugriff fehlgeschlagen: " + err.message);
    }
  }

  function stopCameraScanning() {
    scanningActive = false;
    if (cameraStream) {
      cameraStream.getTracks().forEach((track) => track.stop());
      cameraStream = null;
    }
  }

  function scanFrame() {
    if (!scanningActive) return; // camera was stopped - don't schedule another frame

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvasCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = canvasCtx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      const trackId = code ? extractTrackId(code.data) : null;

      if (trackId) {
        stopCameraScanning();
        showNowPlayingView();
        setStatus("Song wird abgespielt …");
        playTrack(trackId).catch((err) => setStatus("Fehler: " + err.message));
        return;
      }
    }
    requestAnimationFrame(scanFrame);
  }

  init();
})();
</script>
</body>
</html>
