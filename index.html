<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster Custom Player</title>
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        #login-section, #scanner-section { max-width: 500px; margin: 0 auto; }
        button { background: #1DB954; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 20px;}
        button:hover { background: #1ed760; }
        #reader { width: 100%; background: #222; margin-top: 20px; border-radius: 10px; overflow: hidden;}
        #status { margin-top: 20px; font-size: 18px; font-weight: normal; min-height: 50px; color: #1DB954; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Hitster Player 🎧</h1>

    <div id="login-section">
        <p>Um Lieder direkt abzuspielen, musst du dich einmalig mit Spotify verbinden.</p>
        <button id="login-btn">Mit Spotify einloggen</button>
    </div>

    <div id="scanner-section" class="hidden">
        <p>Scanne den QR-Code auf deiner Karte.</p>
        <div id="reader"></div>
        <div id="status">Bereit zum Scannen...</div>
    </div>

    <script>
        // === KONFIGURATION ===
        // 1. Trage hier deine Spotify Client ID ein:
        const CLIENT_ID = '1ebdd25083a54609b5700cdb95717068'; 
        
        // Die Weiterleitungs-URL (entspricht der aktuellen URL deines Webservers)
        const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];
        
        let accessToken = null;
        let html5QrcodeScanner = null;

        // Token aus der URL auslesen (wird von Spotify nach Login zurückgegeben)
        const hash = window.location.hash;
        if (hash) {
            accessToken = new URLSearchParams(hash.substring(1)).get('access_token');
            window.location.hash = ''; // URL im Browser aufräumen
        }

        // Benutzeroberfläche steuern
        if (!accessToken) {
            document.getElementById('login-btn').addEventListener('click', () => {
                // Wir fordern die Berechtigung an, die Musikwiedergabe zu steuern
                const scope = 'user-modify-playback-state';
                const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scope)}`;
                window.location.href = authUrl;
            });
        } else {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('scanner-section').classList.remove('hidden');
            startScanner();
        }

        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { fps: 10, qrbox: {width: 250, height: 250} }, 
                false
            );
            html5QrcodeScanner.render(onScanSuccess);
        }

        let isPlaying = false; 

        function onScanSuccess(decodedText) {
            if (isPlaying) return; // Verhindert, dass der Code 10x pro Sekunde feuert

            // Extrahiere die Spotify Track-ID aus der URL (z.B. https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT...)
            let trackUri = null;
            if (decodedText.includes("spotify.com/track/")) {
                const trackId = decodedText.split("track/")[1].split("?")[0];
                trackUri = `spotify:track:${trackId}`;
            } else if (decodedText.startsWith("spotify:track:")) {
                trackUri = decodedText;
            }

            if (trackUri) {
                isPlaying = true;
                document.getElementById('status').innerText = "Wird geladen... ⏳";
                
                // Scanner kurz pausieren
                html5QrcodeScanner.pause();
                
                playSpotifyTrack(trackUri);
                
                // Nach 4 Sekunden Scanner für die nächste Karte wieder freigeben
                setTimeout(() => {
                    isPlaying = false;
                    html5QrcodeScanner.resume();
                    document.getElementById('status').innerText = "Bereit für die nächste Karte!";
                }, 4000);
            } else {
                document.getElementById('status').innerText = "Das ist kein gültiger Spotify-Link!";
            }
        }

        async function playSpotifyTrack(uri) {
            try {
                const response = await fetch('https://api.spotify.com/v1/me/player/play', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ uris: [uri] })
                });

                if (response.ok || response.status === 204) {
                    document.getElementById('status').innerText = "Lied wird abgespielt! 🎶";
                } else {
                    const data = await response.json();
                    if (data.error && data.error.reason === 'NO_ACTIVE_DEVICE') {
                        document.getElementById('status').innerHTML = "<span style='color:red'><b>Fehler:</b> Bitte öffne die Spotify-App im Hintergrund deines Handys und spiele kurz einen Song an, damit das Gerät 'aktiv' ist!</span>";
                    } else {
                        document.getElementById('status').innerText = "Fehler beim Abspielen.";
                    }
                }
            } catch (error) {
                document.getElementById('status').innerText = "Netzwerkfehler.";
            }
        }
    </script>
</body>
</html>
